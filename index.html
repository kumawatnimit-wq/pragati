<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F1D18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Wisdom">
<meta name="mobile-web-app-capable" content="yes">
<title>AI Wisdom — Daily Growth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1D18;
  --surface:#17281F;
  --surface-2:#1F3527;
  --surface-3:#28422F;
  --border:#31493B;
  --border-soft:#25392C;
  --text:#F2EFE3;
  --text-dim:#A9BCAC;
  --text-faint:#96AC9D;
  --gold:#E3A857;
  --gold-dim:#B9884A;
  --gold-soft:rgba(227,168,87,.16);
  --sage:#84B594;
  --sage-soft:rgba(132,181,148,.16);
  --coral:#EA8F78;
  --coral-soft:rgba(234,143,120,.16);
  --radius-sm:10px;
  --radius:16px;
  --radius-lg:24px;
  --radius-card:20px;
  --shadow: 0 16px 40px -16px rgba(0,0,0,.55);
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:'JetBrains Mono', 'SF Mono', Consolas, monospace;
  --nav-w: 252px;
  /* Type scale - one set of sizes used everywhere. Nothing below 13px. */
  --fs-page:22px;
  --fs-card:17px;
  --fs-body:14.5px;
  --fs-small:13px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1100px 550px at 105% -10%, rgba(227,168,87,.08), transparent 60%),
    radial-gradient(900px 500px at -10% 105%, rgba(132,181,148,.10), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0; letter-spacing:.2px;}
h3{font-size:var(--fs-card);}
/* numbers always mono */
.num-mono{font-family:var(--font-mono); font-weight:600;}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--gold-soft); color:var(--text);}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:6px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}

/* ---------- Layout ---------- */
#app{min-height:100vh;}
.sidebar{
  width:var(--nav-w); flex-shrink:0; background:var(--surface);
  border-right:1px solid var(--border-soft);
  display:flex; flex-direction:column; padding:22px 16px;
  position:fixed; top:0; left:0; bottom:0; z-index:40;
  transition:transform .28s ease;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 8px 20px 8px;}
.brand-mark{width:34px;height:34px; flex-shrink:0;}
.brand-name{font-family:var(--font-display); font-size:21px; font-weight:700; color:var(--text);}
.brand-sub{font-size:var(--fs-small); color:var(--text-faint); letter-spacing:.4px; text-transform:uppercase; margin-top:1px;}
.nav-list{list-style:none; margin:6px 0 0 0; padding:0; display:flex; flex-direction:column; gap:2px; overflow-y:auto; flex:1 1 auto; min-height:0;}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px;
  color:var(--text-dim); font-size:14.5px; font-weight:600; background:transparent; border:none; width:100%; text-align:left;
  transition:background .15s ease, color .15s ease;
}
.nav-item:hover{background:var(--surface-2); color:var(--text);}
.nav-item.active{background:linear-gradient(135deg, var(--gold-soft), var(--sage-soft)); color:var(--text);}
.nav-icon{
  width:30px; height:30px; border-radius:9px; background:var(--surface-3); display:flex; align-items:center; justify-content:center;
  font-size:15px; flex-shrink:0;
}
.nav-item.active .nav-icon{background:var(--gold); color:var(--surface);}
.sidebar-foot{margin-top:auto; padding:14px 8px 4px; font-size:var(--fs-small); color:var(--text-faint); line-height:1.5;}
.nav-group{list-style:none; margin-top:16px;}
.nav-group:first-child{margin-top:2px;}
.nav-group-label{
  font-size:var(--fs-small); font-weight:700; letter-spacing:.7px; text-transform:uppercase;
  color:var(--text-faint); padding:0 12px 6px;
}
.nav-group-items{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
.lang-toggle{display:flex; gap:6px; padding:10px 8px; flex-shrink:0; border-top:1px solid var(--border-soft); margin-top:6px;}
.lang-btn{
  flex:1; padding:8px 0; border-radius:10px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text-dim); font-size:var(--fs-small); font-weight:700;
}
.lang-btn.active{background:var(--gold); color:#20160A; border-color:var(--gold);}

/* Bottom navigation (mobile only) */
.bottom-nav{display:none;}

/* Habit tick feedback */
@keyframes tickPop{0%{transform:scale(.85);}60%{transform:scale(1.14);}100%{transform:scale(1);}}
@keyframes sageGlow{0%{box-shadow:0 0 0 0 rgba(132,181,148,.55);}100%{box-shadow:0 0 0 13px rgba(132,181,148,0);}}
.checkbox.just-checked{animation:tickPop .28s ease-out, sageGlow .6s ease-out;}

/* Aaj ka EK kaam */
.one-thing{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.one-thing .input{flex:1; min-width:180px;}
.one-thing-done{text-decoration:line-through; color:var(--text-faint);}

/* Six life areas strip */
.area-strip{display:grid; grid-template-columns:repeat(6,1fr); gap:10px;}
.area-ring{display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center;}
.area-ring-pct{font-size:var(--fs-small); color:var(--text);}
.area-ring-lbl{font-size:var(--fs-small); color:var(--text-dim); line-height:1.2;}

/* Weekly points chart */
.pts-chart{display:flex; align-items:flex-end; gap:8px; height:96px; margin-top:6px;}
.pts-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:5px; height:100%;}
.pts-fill{width:100%; background:linear-gradient(180deg, var(--gold), var(--sage)); border-radius:7px 7px 0 0; min-height:3px;}
.pts-day{font-size:var(--fs-small); color:var(--text-faint);}

.sleep-chart{display:flex; align-items:flex-end; gap:8px; height:96px; margin-top:6px;}
.sleep-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:5px; height:100%;}
.sleep-fill{width:100%; background:linear-gradient(180deg, var(--sage), var(--surface-3)); border-radius:7px 7px 0 0; min-height:3px;}
.sleep-day{font-size:var(--fs-small); color:var(--text-faint);}
.note-soft{background:var(--gold-soft); border:1px solid var(--gold-dim); color:var(--text);
  border-radius:12px; padding:12px 14px; font-size:var(--fs-small); margin-bottom:18px;}

/* Never miss twice note - coral only, it is a warning */
.miss-note{color:var(--coral); font-size:var(--fs-small); margin-top:4px;}
.habit-extra{font-size:var(--fs-small); color:var(--text-faint); margin-top:3px;}
.choice-btns{display:flex; flex-direction:column; gap:10px;}
@media(max-width:900px){ .area-strip{grid-template-columns:repeat(3,1fr);} }

.overlay{position:fixed; inset:0; background:rgba(6,12,9,.55); z-index:35; opacity:0; pointer-events:none; transition:opacity .2s ease;}
.overlay.visible{opacity:1; pointer-events:auto;}
.mobile-topbar{display:none;}

.main{flex:1; margin-left:var(--nav-w); min-width:0; display:flex; flex-direction:column;}
.topbar{
  padding:26px 36px 14px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;
}
.topbar-date{font-size:var(--fs-small); color:var(--text-faint); text-transform:uppercase; letter-spacing:.6px; font-weight:600;}
.topbar-greet{font-family:var(--font-display); font-size:26px; margin-top:4px;}
.topbar-stats{display:flex; gap:10px; flex-wrap:wrap;}
.stat-pill{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:999px; padding:8px 14px;
  display:flex; align-items:center; gap:7px; font-size:var(--fs-small); color:var(--text-dim); white-space:nowrap;
}
.stat-pill b{color:var(--text); font-family:var(--font-mono); font-weight:600;}
.view-root{padding:8px 36px 60px;}

/* Row layout only on desktop. On mobile #app must stay block so the
   top bar sits across the top instead of becoming a left-hand column. */
@media(min-width:901px){ #app{display:flex;} }

/* ---------- Components ---------- */
.card{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-card);
  padding:22px; box-shadow:var(--shadow);
}
.card + .card{margin-top:18px;}
/* Consistent vertical gap between ALL stacked blocks, not just card-after-card */
.grid-2 + .card, .grid-3 + .card,
.card + .grid-2, .card + .grid-3,
.grid-2 + .grid-2, .grid-2 + .grid-3,
.grid-3 + .grid-2, .grid-3 + .grid-3,
.stat-box + .card, .stat-box + .grid-2, .stat-box + .grid-3,
.tabs + .grid-2, .tabs + .grid-3{margin-top:18px;}
.section-title{font-size:var(--fs-page); margin-bottom:4px;}
.section-sub{color:var(--text-dim); font-size:var(--fs-body); margin-bottom:22px; line-height:1.5;}
.row{display:flex; gap:16px; flex-wrap:wrap;}
.col{flex:1; min-width:220px;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media(max-width:720px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.btn{
  display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:11px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-size:var(--fs-body); font-weight:600; transition:transform .12s ease, background .15s ease, border-color .15s ease;
}
.btn:hover{background:var(--surface-3); border-color:var(--gold-dim);}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--gold); color:#20160A; border-color:var(--gold);}
.btn-primary:hover{background:#eeb66a; border-color:#eeb66a;}
.btn-ghost{background:transparent; border-color:transparent; color:var(--text-dim); padding:8px 10px;}
.btn-ghost:hover{background:var(--surface-2); color:var(--text);}
.btn-danger{background:transparent; border-color:var(--coral); color:var(--coral);}
.btn-danger:hover{background:var(--coral-soft);}
.btn-sm{padding:7px 12px; font-size:var(--fs-small); border-radius:9px;}
.btn-block{width:100%; justify-content:center;}
.icon-btn{
  width:32px; height:32px; border-radius:9px; background:transparent; border:1px solid transparent; color:var(--text-faint);
  display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;
}
.icon-btn:hover{background:var(--surface-3); color:var(--text);}

.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
.field label{font-size:var(--fs-small); font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.3px;}
.input,.select,.textarea{
  background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; color:var(--text); font-size:14px; width:100%;
}
.input:focus,.select:focus,.textarea:focus{border-color:var(--gold-dim);}
.textarea{resize:vertical; min-height:64px;}
.input-row{display:flex; gap:10px;}

.slider{-webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:99px; background:var(--surface-3); outline:none;}
.slider::-webkit-slider-thumb{-webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:var(--gold); cursor:pointer; border:3px solid var(--surface); box-shadow:0 2px 6px rgba(0,0,0,.4);}
.slider::-moz-range-thumb{width:20px; height:20px; border-radius:50%; background:var(--gold); cursor:pointer; border:3px solid var(--surface);}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-small); font-weight:700; padding:4px 10px; border-radius:999px;}
.badge-sage{background:var(--sage-soft); color:var(--sage);}
.badge-gold{background:var(--gold-soft); color:var(--gold);}
.badge-coral{background:var(--coral-soft); color:var(--coral);}
.badge-muted{background:var(--surface-3); color:var(--text-dim);}

.progress{height:8px; border-radius:99px; background:var(--surface-3); overflow:hidden;}
.progress > div{height:100%; background:linear-gradient(90deg, var(--sage), var(--gold)); border-radius:99px; transition:width .4s ease;}

.list{display:flex; flex-direction:column; gap:10px;}
.list-item{
  display:flex; align-items:center; gap:14px; padding:13px 14px; border-radius:13px; background:var(--surface-2); border:1px solid var(--border-soft);
}
.list-item-main{flex:1; min-width:0;}
.list-item-title{font-size:var(--fs-body); font-weight:700; color:var(--text); overflow-wrap:anywhere;}
.list-item-sub{font-size:var(--fs-small); color:var(--text-dim); margin-top:2px; line-height:1.4; overflow-wrap:anywhere;}
.list-item-amount{font-family:var(--font-mono); font-weight:600; font-size:var(--fs-body); white-space:nowrap;}
.list-item-actions{display:flex; gap:4px; flex-shrink:0;}

.empty-state{
  text-align:center; padding:30px 20px; color:var(--text-faint);
  display:flex; flex-direction:column; align-items:center; gap:12px;
}
.empty-state p{margin:0; max-width:34ch;}
.empty-state .emoji{font-size:30px; display:block; margin-bottom:10px;}
.empty-state p{font-size:var(--fs-body); line-height:1.6;}

.checkbox-row{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:13px; background:var(--surface-2); border:1px solid var(--border-soft);}
.detail-item{display:flex; align-items:flex-start; gap:14px; padding:14px; border-radius:13px; background:var(--surface-2); border:1px solid var(--border-soft);}
.detail-item .checkbox{margin-top:2px;}
.detail-illo{flex-shrink:0; background:var(--surface-3); border-radius:11px; padding:4px;}
.detail-num{font-family:var(--font-mono); font-size:var(--fs-small); color:var(--text-faint); width:20px; flex-shrink:0; padding-top:3px;}
.checkbox{
  width:24px; height:24px; border-radius:8px; border:2px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center;
  background:var(--surface); transition:all .15s ease; font-size:13px; color:transparent;
}
.checkbox.checked{background:var(--sage); border-color:var(--sage); color:var(--surface);}

.tabs{
  display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:20px;
  scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  padding:9px 15px; border-radius:11px; background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text-dim);
  font-size:var(--fs-small); font-weight:700; white-space:nowrap; flex-shrink:0; scroll-snap-align:start;
}
.tab.active{background:var(--gold); color:#20160A; border-color:var(--gold);}

.stat-box{background:var(--surface-2); border:1px solid var(--border-soft); border-radius:var(--radius-card); padding:18px;}
.stat-box .num{font-family:var(--font-mono); font-size:26px; font-weight:700; color:var(--text);}
.stat-box .lbl{font-size:var(--fs-small); color:var(--text-dim); margin-top:4px;}

.timer-wrap{display:flex; flex-direction:column; align-items:center; gap:18px; padding:14px 0 6px;}
.timer-durations{display:flex; gap:8px;}
.dur-btn{padding:8px 16px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim); font-size:var(--fs-small); font-weight:700;}
.dur-btn.active{background:var(--sage-soft); border-color:var(--sage); color:var(--sage);}
.timer-ring{
  width:190px; height:190px; border-radius:50%; border:5px solid var(--sage); display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--surface-2);
}
.timer-ring .time{font-family:var(--font-mono); font-size:38px; font-weight:700;}
.timer-ring .lbl{font-size:var(--fs-small); color:var(--text-faint); margin-top:4px; text-transform:uppercase; letter-spacing:.5px;}
.timer-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}

.breath-circle{
  width:190px; height:190px; border-radius:50%;
  background:radial-gradient(circle at 38% 30%, var(--sage-soft), var(--surface-2));
  border:3px solid var(--sage); display:flex; flex-direction:column; align-items:center; justify-content:center;
  transform:scale(.72); transition:transform 1s ease-in-out;
}
.breath-phase{font-weight:700; font-size:var(--fs-body); letter-spacing:.4px;}
.breath-count{font-family:var(--font-mono); font-size:26px; margin-top:4px;}

.video-embed{position:relative; width:100%; padding-top:56.25%; border-radius:14px; overflow:hidden; background:#000;}
.video-embed iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}

.weight-chart{width:100%; height:auto; display:block;}
.chart-label{font-family:var(--font-mono); font-size:11px; fill:var(--text-faint);}
.chart-label.gold{fill:var(--gold);}

.sprout-wrap{display:flex; align-items:center; gap:22px; flex-wrap:wrap;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(6,12,9,.62); z-index:60; display:flex; align-items:flex-end; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .18s ease;
}
.modal-overlay.visible{opacity:1; pointer-events:auto;}
.modal{
  background:var(--surface); border:1px solid var(--border); border-radius:22px 22px 0 0; width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
  padding:24px 22px 26px; transform:translateY(24px); transition:transform .22s ease;
}
.modal-overlay.visible .modal{transform:translateY(0);}
@media(min-width:640px){
  .modal-overlay{align-items:center;}
  .modal{border-radius:22px;}
}
.modal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.modal-footer{display:flex; gap:10px; margin-top:6px;}

.toast-host{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{background:var(--surface-3); border:1px solid var(--border); color:var(--text); padding:10px 18px; border-radius:11px; font-size:var(--fs-small); font-weight:600; box-shadow:var(--shadow); animation:toast-in .18s ease;}
.toast.error{border-color:var(--coral); color:var(--coral);}
@keyframes toast-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

.loading-screen{position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:100;}
.loading-screen .lbl{color:var(--text-faint); font-size:var(--fs-small);}

.helper-text{font-size:var(--fs-small); color:var(--text-faint); margin-top:-6px; margin-bottom:14px; line-height:1.5;}

/* Mobile */
@media(max-width:900px){
  .bottom-nav{
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:45;
    background:var(--surface); border-top:1px solid var(--border-soft);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .bottom-nav button{
    flex:1; min-height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    background:transparent; border:none; color:var(--text-faint);
    font-size:var(--fs-small); font-weight:600; border-radius:12px; padding:4px 2px;
  }
  .bottom-nav button .bn-icon{font-size:17px; line-height:1;}
  .bottom-nav button.active{color:var(--gold);}
  :root{--nav-w:0px;}
  /* FIX: #app is display:flex (a row), which turned .mobile-topbar into a
     left-hand column and squeezed content to ~290px. Stack normally instead. */
  #app{display:block;}
  .sidebar{transform:translateX(-100%); width:270px;}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0; width:100%; display:block;}
  .mobile-topbar{
    display:flex; align-items:center; gap:12px; padding:14px 18px; position:sticky; top:0; z-index:30;
    width:100%; background:var(--bg); border-bottom:1px solid var(--border-soft);
  }
  .mobile-topbar .brand-name{font-size:18px;}
  /* Title block on top, stat pills in one sideways-scrolling row */
  .topbar{padding:18px 18px 10px; flex-direction:column; align-items:stretch; gap:12px;}
  .topbar-stats{
    flex-wrap:nowrap; overflow-x:auto; width:100%;
    -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:2px;
  }
  .topbar-stats::-webkit-scrollbar{display:none;}
  .stat-pill{flex:0 0 auto;}
  .view-root{padding:8px 18px 104px;}
  .grid-3{grid-template-columns:1fr 1fr;}
  /* Soft fade at the right of scrollable tab rows = hint there is more */
  .tabs{
    -webkit-mask-image:linear-gradient(to right, #000 0, #000 calc(100% - 26px), transparent 100%);

function toDateStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr(){ return toDateStr(new Date()); }
function parseDate(ds){ return new Date(ds+'T00:00:00'); }
function formatDateNice(ds){
  if(!ds) return '';
  return parseDate(ds).toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short'});
}
function formatDateShort(ds){
  if(!ds) return '';

}

function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
function daysAgoStr(n){ const d=new Date(); d.setDate(d.getDate()-n); return toDateStr(d); }
function lastNDates(n){ const arr=[]; for(let i=n-1;i>=0;i--) arr.push(daysAgoStr(i)); return arr; }

function computeStreak(successSet){
  let cursor = new Date();
  if(!successSet.has(toDateStr(cursor))) cursor.setDate(cursor.getDate()-1);
  let streak=0;
  while(successSet.has(toDateStr(cursor))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

/* ----- Sleep ----- */
function sleepFor(date){ return state.sleepLogs[date] || null; }
function sleepHours(bed, wake){
  if(!bed || !wake) return null;
  const [bh,bm] = bed.split(':').map(Number);
  const [wh,wm] = wake.split(':').map(Number);
  let mins = (wh*60+wm) - (bh*60+bm);
  if(mins <= 0) mins += 24*60;           // crossed midnight
  return Math.round(mins/60*10)/10;
}

/* Which weekday do I miss most, looking back 4 weeks */
function worstWeekday(){
  const days = lastNDates(28);
  const names = ['Somvaar','Mangalvaar','Budhvaar','Guruvaar','Shukravaar','Shanivaar','Ravivaar'];
  const miss = [0,0,0,0,0,0,0], total = [0,0,0,0,0,0,0];
  days.forEach(d=>{
    const idx = (parseDate(d).getDay()+6)%7;
    state.habits.forEach(h=>{
      total[idx]++;
      if(!(state.habitLogs[d]||{})[h.id]) miss[idx]++;
    });
  });
  let best = null;
  for(let i=0;i<7;i++){
    if(!total[i]) continue;
    const rate = miss[i]/total[i];
    if(!best || rate > best.rate) best = {name:names[i], rate, miss:miss[i], total:total[i]};
  }
  return best;
}
/* 14-day cross-area picture: same x-axis, one band per thing */
function renderCrossChart(){
  const days = lastNDates(14);
  const W = 700, bandH = 34, padL = 92, padR = 10, top = 6;
  const colW = (W - padL - padR) / days.length;
  const sleep = days.map(d=> (sleepFor(d)||{}).hours || 0);
  const money = days.map(d=> state.expenses.filter(e=>e.date===d).reduce((s,e)=>s+(e.amount||0),0));
  const workout = days.map(d=> state.workoutEntries.some(w=>w.date===d));
  const ff = days.map(d=>{
    const conflict = state.conflictNotes.some(c=>c.date===d);
    const entry = state.relationshipEntries.find(r=>r.date===d);
    if(conflict) return 'bad';
    if(entry) return entry.fightFree ? 'good' : 'bad';
    return 'none';
  });
  const mood = days.map(d=> (state.eveningLogs[d]||{}).stuck || '');
  const sMax = Math.max(9, ...sleep), mMax = Math.max(1, ...money);

  const line = (vals, max, colour, y0) => {
    const pts = vals.map((v,i)=> `${(padL + i*colW + colW/2).toFixed(1)},${(y0 + bandH - 4 - (v/max)*(bandH-10)).toFixed(1)}`).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${colour}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`
      + vals.map((v,i)=> `<circle cx="${(padL + i*colW + colW/2).toFixed(1)}" cy="${(y0 + bandH - 4 - (v/max)*(bandH-10)).toFixed(1)}" r="2.6" fill="${colour}"/>`).join('');
  };
  const dots = (vals, y0, colourFor) => vals.map((v,i)=>{
    const c = colourFor(v);
    if(!c) return '';
    return `<circle cx="${(padL + i*colW + colW/2).toFixed(1)}" cy="${(y0 + bandH/2).toFixed(1)}" r="5" fill="${c}"/>`;
  }).join('');
  const label = (txt, y0) => `<text x="6" y="${(y0 + bandH/2 + 4).toFixed(1)}" class="chart-label" style="fill:var(--text-dim)">${txt}</text>`;

  const rows = [
    {t:'Neend (ghante)', draw:(y)=> line(sleep, sMax, '#84B594', y)},
    {t:'Workout', draw:(y)=> dots(workout, y, v=> v ? '#84B594' : null)},
    {t:'Mann atka', draw:(y)=> dots(mood, y, v=> v ? (v==='kahin_nahi' ? '#84B594' : '#EA8F78') : null)},
    {t:'Fight-free', draw:(y)=> dots(ff, y, v=> v==='good' ? '#84B594' : (v==='bad' ? '#EA8F78' : null))},
    {t:'Kharcha', draw:(y)=> line(money, mMax, '#E3A857', y)},
  ];
  const H = top + rows.length*bandH + 20;
  let svg = '';
  rows.forEach((r,i)=>{
    const y = top + i*bandH;
    svg += `<line x1="${padL}" y1="${y+bandH}" x2="${W-padR}" y2="${y+bandH}" stroke="var(--border-soft)" stroke-width="1"/>`;
    svg += label(r.t, y) + r.draw(y);
  });
  svg += days.map((d,i)=> (i%3===0 || i===days.length-1)
    ? `<text x="${(padL + i*colW + colW/2).toFixed(1)}" y="${H-4}" text-anchor="middle" class="chart-label">${formatDateShort(d).split(' ')[0]}</text>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">${svg}</svg>`;
}

function openChoice(title, note, options, onPick){

  document.getElementById('modalTitle').textContent = title;
  const oldForm = document.getElementById('modalForm');
  const form = oldForm.cloneNode(false);
  oldForm.replaceWith(form);
  form.innerHTML = (note ? `<p class="section-sub">${escapeHtml(note)}</p>` : '')
    + `<div class="choice-btns">`
    + options.map((o,i)=>`<button type="button" class="btn ${o.primary?'btn-primary':''} btn-block" data-choice="${i}">${escapeHtml(o.label)}</button>`).join('')
    + `</div>`;
  overlay.classList.add('visible');
  form.addEventListener('click', (e)=>{
    const b = e.target.closest('[data-choice]');
    if(!b) return;
    overlay.classList.remove('visible');
    onPick(options[parseInt(b.getAttribute('data-choice'),10)].value);
  });
}

/* ===================== Modal ===================== */
function openModal({title, fields, values, submitLabel, onSubmit, onDelete}){
  const overlay = document.getElementById('modalOverlay');
  document.getElementById('modalTitle').textContent = title;
  const oldForm = document.getElementById('modalForm');
  const form = oldForm.cloneNode(false);
  oldForm.replaceWith(form);

  let html = '';
  fields.forEach(f=>{
    const val = values && values[f.key]!=null ? values[f.key] : '';
    html += `<div class="field"><label>${escapeHtml(f.label)}</label>`;
    if(f.type==='textarea'){
      html += `<textarea class="textarea" name="${f.key}" placeholder="${escapeHtml(f.placeholder||'')}" ${f.big?'style="min-height:180px;"':''} ${f.required?'required':''}>${escapeHtml(val)}</textarea>`;
    } else if(f.type==='select'){
      html += `<select class="select" name="${f.key}" ${f.required?'required':''}>`;
      (f.options||[]).forEach(opt=>{
        const ov = typeof opt==='object'?opt.value:opt;
        const ol = typeof opt==='object'?opt.label:opt;
        html += `<option value="${escapeHtml(ov)}" ${String(ov)===String(val)?'selected':''}>${escapeHtml(ol)}</option>`;
      });
      html += `</select>`;
    } else {
      html += `<input class="input" type="${f.type||'text'}" name="${f.key}" value="${escapeHtml(val)}" placeholder="${escapeHtml(f.placeholder||'')}" ${f.step?`step="${f.step}"`:''} ${f.required?'required':''}>`;
    }
    if(f.helper) html += `<div class="helper-text">${escapeHtml(f.helper)}</div>`;
    html += `</div>`;
  });
  html += `<div class="modal-footer">`;
  if(onDelete){ html += `<button type="button" class="btn btn-danger" id="modalDeleteBtn">Delete</button>`; }
  html += `<button type="button" class="btn btn-ghost" id="modalCancelBtn">Cancel</button>
    <button type="submit" class="btn btn-primary" style="flex:1;">${escapeHtml(submitLabel||'Save')}</button>
  </div>`;
  form.innerHTML = html;

  overlay.classList.add('visible');
  const closeIt = ()=> overlay.classList.remove('visible');
  document.getElementById('modalCancelBtn').addEventListener('click', closeIt);
  document.getElementById('modalCloseBtn').onclick = closeIt;
  if(onDelete){
    document.getElementById('modalDeleteBtn').addEventListener('click', ()=>{ closeIt(); onDelete(); });
  }
  form.addEventListener('submit', (e)=>{
    e.preventDefault();
    const data = {};
    fields.forEach(f=>{
      const el = form.elements[f.key];
      let v = el.value;
      if(f.type==='number') v = v===''? null : parseFloat(v);
      data[f.key] = v;
    });
    closeIt();
    onSubmit(data);
  });
}
document.getElementById('modalOverlay').addEventListener('click', (e)=>{

/* ===================== Sprout visual ===================== */
function sproutSVG(percent, size){
  size = size||150;
  const p = clamp(percent,0,100);
  // 0% gets its own deliberate "seed in the soil" look instead of a bare line
  if(p <= 0){
    return `<svg viewBox="0 0 120 100" width="${size}" height="${Math.round(size*100/120)}" role="img" aria-label="Not started yet">
      <path d="M18 88 Q60 79 102 88" stroke="#28422F" stroke-width="7" fill="none" stroke-linecap="round"/>
      <line x1="60" y1="76" x2="60" y2="62" stroke="#84B594" stroke-width="4" stroke-linecap="round"/>
      <path d="M60 68 q-16 -6 -21 7 q15 5 21 -7" fill="#84B594" opacity=".75"/>
      <path d="M60 64 q14 -6 19 6 q-14 4 -19 -6" fill="#84B594" opacity=".55"/>
      <ellipse cx="60" cy="80" rx="10" ry="7" fill="#E3A857" opacity=".9"/>
    </svg>`;
  }
  const stemH = 22 + (p/100)*66;
  const pairs = Math.min(4, Math.floor(p/22));
  const bloom = p>=95;
  let leaves='';
  for(let i=0;i<pairs;i++){
    const y = 92 - (i+1)*(stemH/(pairs+1));
    const op = (0.55+i*0.11).toFixed(2);
    leaves += `<path d="M60 ${y} q-19 -6 -24 11 q17 4 24 -11" fill="#84B594" opacity="${op}"/>
               <path d="M60 ${y} q19 -6 24 11 q-17 4 -24 -11" fill="#84B594" opacity="${op}"/>`;
  }
  return `<svg viewBox="0 0 120 100" width="${size}" height="${Math.round(size*100/120)}">
    <line x1="60" y1="94" x2="60" y2="${94-stemH}" stroke="#84B594" stroke-width="4" stroke-linecap="round"/>
    ${leaves}
    ${bloom? `<circle cx="60" cy="${94-stemH}" r="8" fill="#E3A857"/>`:''}
  </svg>`;
}

/* ===================== MORNING RITUAL ===================== */
function getRitualEntry(date, practiceId){
  const cur = (state.ritualLogs[date] && state.ritualLogs[date][practiceId]) || {};
  return {done:false, duration:10, note:'', checked:{}, ...cur};
}
function setRitualEntry(date, practiceId, patch){
  if(!state.ritualLogs[date]) state.ritualLogs[date] = {};
  const cur = getRitualEntry(date, practiceId);
  state.ritualLogs[date][practiceId] = {...cur, ...patch};
  saveKey('ritualLogs');
}

function renderRitual(){
  const today = todayStr();
  const doneCount = RITUAL_PRACTICES.filter(p=> getRitualEntry(today,p.id).done).length;
  const active = RITUAL_PRACTICES.find(p=>p.id===ritualActiveTab) || RITUAL_PRACTICES[0];

  let panel;
  if(active.id==='breathing') panel = renderBreathingPanel();
  else if(active.id==='stretching') panel = renderStretchingPanel();
  else if(active.id==='mangalMaitri') panel = renderMangalMaitriPanel();
  else if(active.id==='meditation') panel = renderMeditationPanel(active);
  else if(active.id==='recovery') panel = renderRecoveryPanel();
  else panel = renderGenericTimerPanel(active);

  return `
  <div class="section-title">🌅 Morning Ritual</div>
  <div class="section-sub">${formatDateNice(today)} · ${doneCount}/${RITUAL_PRACTICES.length} practices done <span class="badge badge-sage" style="margin-left:6px;">${Math.round(doneCount/RITUAL_PRACTICES.length*100)}%</span></div>

    ${RITUAL_PRACTICES.map(p=>`<button class="tab ${p.id===active.id?'active':''}" data-ritual-tab="${p.id}">${p.icon} ${p.label} ${getRitualEntry(today,p.id).done?'✓':''}</button>`).join('')}
  </div>

  ${panel}`;
}

function attachRitualHandlers(){
  document.querySelectorAll('[data-ritual-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(activeTimer && activeTimer.running) pauseTimer();
      if(breathTimer && breathTimer.running) pauseBreathing();
      ritualActiveTab = btn.getAttribute('data-ritual-tab');
      switchView('ritual');
    });
  });
  const active = RITUAL_PRACTICES.find(p=>p.id===ritualActiveTab) || RITUAL_PRACTICES[0];
  if(active.id==='breathing') attachBreathingHandlers();
  else if(active.id==='stretching') attachStretchingHandlers();
  else if(active.id==='mangalMaitri') attachMangalMaitriHandlers();
  else if(active.id==='meditation') attachMeditationHandlers();
  else if(active.id==='recovery') attachRecoveryHandlers();
  else attachGenericTimerHandlers();
}

function attachGenericTimerHandlers(){
  const today = todayStr();
  document.querySelectorAll('[data-dur]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const m = parseInt(btn.getAttribute('data-dur'),10);
      setRitualEntry(today, ritualActiveTab, {duration:m});
      if(activeTimer) stopTimer();
      switchView('ritual');
    });
  });
  const startBtn = document.getElementById('timerStartBtn');
  if(startBtn) startBtn.addEventListener('click', ()=>{
    if(activeTimer && activeTimer.practiceId===ritualActiveTab && activeTimer.running){ pauseTimer(); }
    else { startTimer(ritualActiveTab); }
  });
  const resetBtn = document.getElementById('timerResetBtn');
  if(resetBtn) resetBtn.addEventListener('click', ()=> stopTimer());
  const doneBtn = document.getElementById('markDoneBtn');
  if(doneBtn) doneBtn.addEventListener('click', ()=>{
    const cur = getRitualEntry(today, ritualActiveTab);
    setRitualEntry(today, ritualActiveTab, {done: !cur.done});
    switchView('ritual');
  });
  const saveNoteBtn = document.getElementById('saveNoteBtn');
  if(saveNoteBtn) saveNoteBtn.addEventListener('click', ()=>{
    setRitualEntry(today, ritualActiveTab, {note:document.getElementById('ritualNote').value});
    showToast('Note saved');
  });
  syncTimerUI();
}
function startTimer(practiceId){
  const today = todayStr();
  const entry = getRitualEntry(today, practiceId);
  if(!activeTimer || activeTimer.practiceId!==practiceId){
    activeTimer = {practiceId, remaining: entry.duration*60, totalSeconds: entry.duration*60, intervalId:null, running:false};
  }
  activeTimer.running = true;
  clearInterval(activeTimer.intervalId);
  activeTimer.intervalId = setInterval(()=>{
    activeTimer.remaining--;
    if(activeTimer.remaining<=0){
      clearInterval(activeTimer.intervalId);
      activeTimer.running = false;
      activeTimer.remaining = 0;
      setRitualEntry(todayStr(), practiceId, {done:true});
      showToast('Practice complete 🌿');
      if(currentView==='ritual') switchView('ritual');
      return;
    }
    syncTimerUI();
  }, 1000);
  syncTimerUI();
}
function pauseTimer(){
  if(!activeTimer) return;
  activeTimer.running = false;
  clearInterval(activeTimer.intervalId);
  syncTimerUI();
}
function stopTimer(){
  if(activeTimer){ clearInterval(activeTimer.intervalId); }
  const today = todayStr();
  const entry = getRitualEntry(today, ritualActiveTab);
  activeTimer = {practiceId:ritualActiveTab, remaining:entry.duration*60, totalSeconds:entry.duration*60, intervalId:null, running:false};
  syncTimerUI();
}
function syncTimerUI(){
  const timeEl = document.getElementById('timerTime');
  if(!timeEl) return;
  const today = todayStr();
  const entry = getRitualEntry(today, ritualActiveTab);
  let remaining = entry.duration*60;
  let running = false;
  let lbl = 'choose duration';
  if(activeTimer && activeTimer.practiceId===ritualActiveTab){
    remaining = activeTimer.remaining;
    running = activeTimer.running;
    lbl = running? 'in progress' : (remaining<activeTimer.totalSeconds? 'paused' : 'ready');
  }
  const mm = String(Math.floor(remaining/60)).padStart(2,'0');
  const ss = String(remaining%60).padStart(2,'0');
  timeEl.textContent = `${mm}:${ss}`;
  document.getElementById('timerLbl').textContent = lbl;
  const startBtn = document.getElementById('timerStartBtn');
  if(startBtn) startBtn.textContent = running? '⏸ Pause' : '▶ Start';
}

/* ---- Breathing panel: box-breathing timer ---- */
function buildBreathPhases(s){
  return [
    {key:'inhale', sec:s.inhale, label:'Inhale ↑'},
    {key:'hold1', sec:s.hold1, label:'Hold'},
    {key:'exhale', sec:s.exhale, label:'Exhale ↓'},
    {key:'hold2', sec:s.hold2, label:'Hold'},
  ].filter(p=>p.sec>0);
}
function cycleLength(s){ return (s.inhale||0)+(s.hold1||0)+(s.exhale||0)+(s.hold2||0); }
function computeTotalCycles(s, durationMin){
  const cl = cycleLength(s);
  if(cl<=0) return 0;
  if(durationMin==='inf') return 999;
  return Math.max(1, Math.round((durationMin*60)/cl));
}
function renderBreathingPanel(){
  const today = todayStr();
  const entry = getRitualEntry(today,'breathing');
  const s = state.breathingSettings;
  const cl = cycleLength(s);
  const totalCycles = computeTotalCycles(s, s.durationMin);
  const totalSec = cl*totalCycles;
  const lenLabel = s.durationMin==='inf' ? '∞' : `${Math.floor(totalSec/60)} min ${totalSec%60} sec`;
  return `
  <div class="card">
    <h3>🌬️ Breathing</h3>
    <p class="section-sub" style="margin-bottom:18px;">Set your rhythm, then start.</p>

    <div class="field">
      <label>Inhale — <span id="inhaleVal">${s.inhale}</span>s</label>
      <input type="range" min="2" max="12" value="${s.inhale}" id="inhaleSlider" class="slider">

function attachBreathingHandlers(){
  const today = todayStr();
  const s = state.breathingSettings;
  const sliderDefs = [
    {id:'inhaleSlider', key:'inhale', lbl:'inhaleVal'},
    {id:'hold1Slider', key:'hold1', lbl:'hold1Val'},
    {id:'exhaleSlider', key:'exhale', lbl:'exhaleVal'},
    {id:'hold2Slider', key:'hold2', lbl:'hold2Val'},
  ];
  function liveValues(){
    return {
      inhale: parseInt(document.getElementById('inhaleSlider').value,10)||0,
      hold1: parseInt(document.getElementById('hold1Slider').value,10)||0,
      exhale: parseInt(document.getElementById('exhaleSlider').value,10)||0,
      hold2: parseInt(document.getElementById('hold2Slider').value,10)||0,
    };
  }
  function updateLengthLabels(){
    const v = liveValues();
    const cl = cycleLength(v);
    document.getElementById('cycleLenLbl').textContent = cl+'s';
    const totalCycles = computeTotalCycles(v, s.durationMin);
    const lenEl = document.getElementById('exerciseLenLbl');
    if(s.durationMin==='inf'){ lenEl.textContent = '∞'; }
    else { const totalSec = cl*totalCycles; lenEl.textContent = `${Math.floor(totalSec/60)} min ${totalSec%60} sec`; }
  }
  sliderDefs.forEach(sl=>{
    const el = document.getElementById(sl.id);
    if(!el) return;
    el.addEventListener('input', ()=>{
      document.getElementById(sl.lbl).textContent = el.value;
      updateLengthLabels();
    });
    el.addEventListener('change', ()=>{
      state.breathingSettings[sl.key] = parseInt(el.value,10);
      saveKey('breathingSettings');
    });
  });
  document.querySelectorAll('[data-breath-dur]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const v = btn.getAttribute('data-breath-dur');
      state.breathingSettings.durationMin = v==='inf' ? 'inf' : parseInt(v,10);
      saveKey('breathingSettings');
      switchView('ritual');
    });
  });
  const startBtn = document.getElementById('breathStartBtn');
  if(startBtn) startBtn.addEventListener('click', ()=>{
    if(breathTimer && breathTimer.running){ pauseBreathing(); } else { startBreathing(); }
  });
  const resetBtn = document.getElementById('breathResetBtn');
  if(resetBtn) resetBtn.addEventListener('click', resetBreathing);
  const doneBtn = document.getElementById('breathDoneBtn');
  if(doneBtn) doneBtn.addEventListener('click', ()=>{
    const cur = getRitualEntry(today,'breathing');
    setRitualEntry(today,'breathing',{done:!cur.done});
    switchView('ritual');
  });
  syncBreathUI();
}
function startBreathing(){
  const s = state.breathingSettings;
  const phases = buildBreathPhases(s);
  if(!phases.length){ showToast('Set at least one phase above 0 seconds','error'); return; }
  if(!breathTimer || breathTimer.finished){
    breathTimer = {phaseIdx:0, phaseRemaining:phases[0].sec, cyclesDone:0, totalCycles:computeTotalCycles(s,s.durationMin), running:true, finished:false, intervalId:null};
  } else {
    breathTimer.running = true;
  }
  clearInterval(breathTimer.intervalId);
  breathTimer.intervalId = setInterval(()=>{
    breathTimer.phaseRemaining--;
    if(breathTimer.phaseRemaining<=0){
      breathTimer.phaseIdx++;
      if(breathTimer.phaseIdx>=phases.length){
        breathTimer.phaseIdx = 0;
        breathTimer.cyclesDone++;
        if(breathTimer.cyclesDone>=breathTimer.totalCycles){
          clearInterval(breathTimer.intervalId);
          breathTimer.running=false;
          breathTimer.finished=true;
          setRitualEntry(todayStr(),'breathing',{done:true});
          showToast('Breathing session complete 🌬️');
          if(currentView==='ritual') switchView('ritual');
          return;
        }
      }
      breathTimer.phaseRemaining = phases[breathTimer.phaseIdx].sec;
    }
    syncBreathUI();
  }, 1000);
  syncBreathUI();
}
function pauseBreathing(){
  if(!breathTimer) return;
  breathTimer.running = false;
  clearInterval(breathTimer.intervalId);
  syncBreathUI();
}
function resetBreathing(){
  if(breathTimer) clearInterval(breathTimer.intervalId);
  breathTimer = null;
  const circle = document.getElementById('breathCircle');
  if(circle){ circle.style.transition='transform .3s ease'; circle.style.transform='scale(.72)'; }
  syncBreathUI();
}
function syncBreathUI(){
  const circle = document.getElementById('breathCircle');
  if(!circle) return;
  const s = state.breathingSettings;
  const phases = buildBreathPhases(s);
  const phaseLbl = document.getElementById('breathPhaseLbl');
  const countLbl = document.getElementById('breathCountLbl');
  const cycleLbl = document.getElementById('breathCycleCount');
  const startBtn = document.getElementById('breathStartBtn');
  if(!breathTimer || !phases.length){
    if(phaseLbl) phaseLbl.textContent = 'Ready';
    if(countLbl) countLbl.textContent = phases.length? phases[0].sec : '--';
    if(startBtn) startBtn.textContent = '▶ Start';
    return;
  }
  const phase = phases[breathTimer.phaseIdx];
  if(phaseLbl) phaseLbl.textContent = phase.label;
  if(countLbl) countLbl.textContent = breathTimer.phaseRemaining;
  if(cycleLbl) cycleLbl.textContent = `${breathTimer.cyclesDone} / ${s.durationMin==='inf'?'∞':breathTimer.totalCycles} cycles`;
  if(phase.key==='inhale'){ circle.style.transition = `transform ${phase.sec}s ease-in-out`; circle.style.transform = 'scale(1)'; }
  else if(phase.key==='exhale'){ circle.style.transition = `transform ${phase.sec}s ease-in-out`; circle.style.transform = 'scale(.7)'; }
  if(startBtn) startBtn.textContent = breathTimer.running? '⏸ Pause' : '▶ Start';
}

function parseYouTubeId(url){
  if(!url) return null;
  url = url.trim();
  if(/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/))([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

  const yid = videoState.youtubeId;
  return `

    <div class="field" style="margin-top:16px;">

      <div class="helper-text">Plays right here for this visit. Browsers can't store video files, so you'll pick it again next time you open this tab.</div>

/* ===================== HABIT TRACKER ===================== */
function renderHabits(){
  const today = todayStr();
  const days = lastNDates(7);
  const todayLog = state.habitLogs[today] || {};
  const doneToday = state.habits.filter(h=>todayLog[h.id]).length;

  const yday = daysAgoStr(1);
  // "Never miss twice": anything missed yesterday and still not done today floats to the top
  const ordered = [...state.habits].sort((a,b)=>{
    const miss = h => (habitAgeDays(h.id) >= 2 ? 1 : 0) * ((state.habitLogs[yday]||{})[h.id] ? 0 : 1) * (todayLog[h.id] ? 0 : 1);
    return miss(b) - miss(a);
  });
  const list = state.habits.length? ordered.map(h=>{
    const checked = !!todayLog[h.id];
    const streak = computeStreak(habitDoneDays(h.id));
    const meta = habitMetaFor(h.id);
    const missedYday = habitAgeDays(h.id) >= 2 && !(state.habitLogs[yday]||{})[h.id];
    const mode = habitModeOn(todayStr(), h.id);
    return `<div class="checkbox-row">
      <button class="checkbox ${checked?'checked':''}" data-habit-toggle="${h.id}">${checked?'\u2713':''}</button>
      <div class="list-item-main">
        <div class="list-item-title">${h.icon||'\u2022'} ${escapeHtml(h.name)}
          <span class="badge badge-muted num-mono" style="margin-left:6px;">${meta.points}p</span>
          ${checked && mode==='two' ? '<span class="badge badge-sage" style="margin-left:4px;">2-min</span>' : ''}
        </div>
        <div class="list-item-sub">${streak>0? `\u{1F525} <span class="num-mono">${streak}</span> day streak` : 'No streak yet'}</div>
        ${meta.identity ? `<div class="habit-extra">${escapeHtml(meta.identity)}</div>` : ''}
        ${(missedYday && !checked) ? `<div class="miss-note">Kal chhoot gaya \u2014 aaj 2-minute version hi kar lo${meta.twoMin? ': '+escapeHtml(meta.twoMin):''}</div>` : ''}
      </div>
      <div class="list-item-actions">
        <button class="icon-btn" data-habit-edit="${h.id}">\u270E</button>
      </div>
    </div>`;
  }).join('') : emptyState('\u2705','empty_habits','add_habit','addHabitBtn');

  // daily points + weekly chart
  const todayPts = habitPointsForDay(todayStr());
  const ptsDays = lastNDates(7);
  const ptsVals = ptsDays.map(habitPointsForDay);
  const ptsMax = Math.max(1, ...ptsVals);
  const ptsChart = `<div class="pts-chart">${ptsDays.map((d,i)=>`
      <div class="pts-col">
        <div class="pts-day num-mono">${ptsVals[i]}</div>
        <div class="pts-fill" style="height:${Math.round(ptsVals[i]/ptsMax*70)}%"></div>
        <div class="pts-day">${formatDateShort(d).split(' ')[0]}</div>
      </div>`).join('')}</div>`;

  const gridRows = state.habits.map(h=>{
    const cells = days.map(d=> `<td style="text-align:center; padding:6px;">${state.habitLogs[d] && state.habitLogs[d][h.id] ? '<span style="color:var(--sage)">●</span>' : '<span style="color:var(--border)">○</span>'}</td>`).join('');
    return `<tr><td style="padding:6px 10px 6px 0; font-size:var(--fs-small); color:var(--text-dim); white-space:nowrap;">${h.icon||''} ${escapeHtml(h.name)}</td>${cells}</tr>`;
  }).join('');
  const headerCells = days.map(d=> `<th style="font-size:var(--fs-small); color:var(--text-faint); font-weight:600; padding:6px;">${formatDateShort(d)}</th>`).join('');

  return `
  <div class="section-title">✅ Habit Tracker</div>
  <div class="section-sub">${formatDateNice(today)} · ${doneToday}/${state.habits.length} done today</div>

  <div class="card">
    <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h3>Today</h3>
      <button class="btn btn-sm btn-primary" id="addHabitBtn">+ ${escapeHtml(t('add_habit'))}</button>
    </div>
    <div class="list">${list}</div>
  </div>

  ${state.habits.length? `<div class="card">
    <div class="row" style="justify-content:space-between; align-items:center;">
      <h3>Points</h3>
      <div class="stat-pill">Aaj <b>${todayPts}</b></div>
    </div>

/* Habit extras live in their own key, so old habit records stay untouched */
function saveHabitMeta(id, data, createdAt){
  const prev = state.habitMeta[id] || {};
  state.habitMeta[id] = {
    points: (data.points==null || data.points==='' ? 1 : Number(data.points)),
    twoMin: data.twoMin || '',
    identity: data.identity || '',
    createdAt: createdAt || prev.createdAt || ''
  };
  saveKey('habitMeta');
}
function setHabitDone(id, mode){
  const today = todayStr();
  if(!state.habitLogs[today]) state.habitLogs[today] = {};
  state.habitLogs[today][id] = true;
  saveKey('habitLogs');
  if(!state.habitModeLogs[today]) state.habitModeLogs[today] = {};
  state.habitModeLogs[today][id] = mode;
  saveKey('habitModeLogs');
  justCheckedHabitId = id;
  const streak = computeStreak(habitDoneDays(id));
  if(streak===7 || streak===21 || streak===30) pendingMilestone = 'streak_'+streak;
  const asked = (state.habitCheckins[id]||[]).some(c=>c.milestone===15);
  if(streak===15 && !asked) pendingCheckin = id;
  switchView('habits');
}
function clearHabitDone(id){
  const today = todayStr();
  if(state.habitLogs[today]) delete state.habitLogs[today][id];
  saveKey('habitLogs');
  if(state.habitModeLogs[today]) delete state.habitModeLogs[today][id];
  saveKey('habitModeLogs');
  switchView('habits');
}
function attachHabitsHandlers(){
  // gentle tick animation + milestone toast, both respect prefers-reduced-motion
  if(justCheckedHabitId){
    const el = document.querySelector('[data-habit-toggle="'+justCheckedHabitId+'"]');
    if(el){ el.classList.add('just-checked'); setTimeout(()=>el.classList.remove('just-checked'), 700); }
    justCheckedHabitId = null;
  }
  if(pendingMilestone){ showToast(t(pendingMilestone)); pendingMilestone = null; }
  if(pendingCheckin){
    const hid = pendingCheckin; pendingCheckin = null;
    openChoice('15 din ho gaye', 'Kya abhi bhi aasan lag raha hai? Kya chhota karna hai?', [
      {label:'Aasan hai', value:'easy', primary:true},
      {label:'Mushkil lag raha hai', value:'hard'},
      {label:'Chhota karna hai', value:'smaller'},
    ], (ans)=>{
      if(!state.habitCheckins[hid]) state.habitCheckins[hid] = [];
      state.habitCheckins[hid].push({date: todayStr(), milestone: 15, answer: ans});
      saveKey('habitCheckins');
      if(ans==='smaller'){
        const h = state.habits.find(x=>x.id===hid);
        const meta = habitMetaFor(hid);
        openModal({title:'Chhota kar do', fields:habitFormFields(), values:{...h, ...meta},
          submitLabel:'Save', onSubmit:(data)=>{
            Object.assign(h, {name:data.name, icon:data.icon||'\u2022'});
            saveKey('habits'); saveHabitMeta(hid, data); switchView('habits');
          }});
      } else { showToast('Likh liya'); }
    });
  }
  document.querySelectorAll('[data-habit-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-habit-toggle');
      const today = todayStr();
      const isOn = !!(state.habitLogs[today]||{})[id];
      if(isOn){ clearHabitDone(id); return; }
      const meta = habitMetaFor(id);
      if(meta.twoMin){
        openChoice('Kaise kiya?', meta.twoMin, [
          {label:'Full', value:'full', primary:true},
          {label:'2-min version (aadhe points)', value:'two'},
        ], (mode)=> setHabitDone(id, mode));
      } else {
        setHabitDone(id, 'full');
      }
    });
  });
  const addBtn = document.getElementById('addHabitBtn');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    openModal({title:'Add habit', fields:habitFormFields(), values:{points:1}, submitLabel:'Add', onSubmit:(data)=>{
      const id = uid();
      state.habits.push({id, name:data.name, icon:data.icon||'\u2022'});
      saveKey('habits');
      saveHabitMeta(id, data, todayStr());
      switchView('habits');
      showToast('Habit added');
    }});
  });
  document.querySelectorAll('[data-habit-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-habit-edit');
      const h = state.habits.find(x=>x.id===id);
      openModal({title:'Edit habit', fields:habitFormFields(), values:{...h, ...habitMetaFor(id)}, submitLabel:'Save', onSubmit:(data)=>{
        Object.assign(h, {name:data.name, icon:data.icon||'\u2022'});
        saveKey('habits');
        saveHabitMeta(id, data);
        switchView('habits');
      }, onDelete:()=>{
        state.habits = state.habits.filter(x=>x.id!==id);
        saveKey('habits');
        switchView('habits');
        showToast('Habit removed');
      }});
    });
  });
}

function renderWeightChart(sorted, goal){
  if(!sorted.length) return emptyState('📈','empty_weight','log_weighin','addWeightBtn');
  const w=600,h=180,pad=32;
  const weights = sorted.map(e=>e.weight);
  let min = Math.min(...weights, goal!=null?goal:weights[0]) - 1.5;
  let max = Math.max(...weights, goal!=null?goal:weights[0]) + 1.5;
  if(max===min){max+=1;min-=1;}
  const stepX = sorted.length>1 ? (w-2*pad)/(sorted.length-1) : 0;
  const scaleY = v => h-pad - ((v-min)/(max-min))*(h-2*pad);
  const pts = sorted.map((e,i)=> `${pad+i*stepX},${scaleY(e.weight).toFixed(1)}`).join(' ');
  const goalY = goal!=null? scaleY(goal).toFixed(1) : null;
  return `<svg viewBox="0 0 ${w} ${h}" class="weight-chart" preserveAspectRatio="none">
    ${goal!=null? `<line x1="${pad}" y1="${goalY}" x2="${w-pad}" y2="${goalY}" stroke="#E3A857" stroke-dasharray="4 4" stroke-width="1.4"/>
    <text x="${w-pad}" y="${Number(goalY)-6}" text-anchor="end" class="chart-label gold">goal ${goal}kg</text>`:''}
    <polyline points="${pts}" fill="none" stroke="#84B594" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${sorted.map((e,i)=>`<circle cx="${pad+i*stepX}" cy="${scaleY(e.weight).toFixed(1)}" r="3.6" fill="#84B594" />`).join('')}
    <text x="${pad}" y="${h-8}" class="chart-label">${formatDateShort(sorted[0].date)}</text>
    <text x="${w-pad}" y="${h-8}" text-anchor="end" class="chart-label">${formatDateShort(sorted[sorted.length-1].date)}</text>
  </svg>`;
}

/* ===================== BUSINESS ===================== */
const PAR_KAAM_WEEKLY_TARGET = 120; // minutes
function parKaamThisWeek(){
  const days = lastNDates(7);
  return state.parKaamLogs.filter(l=> days.includes(l.date)).reduce((s,l)=> s+(Number(l.minutes)||0), 0);
}
function daysSince(ds){
  if(!ds) return null;
  return Math.floor((new Date(todayStr()) - new Date(ds)) / 86400000);
}
function decisionsDueForReview(){
  const today = todayStr();
  return state.decisions.filter(d=> d.reviewDate && d.reviewDate <= today && !d.outcome);
}
function renderBusiness(){
  const mins = parKaamThisWeek();
  const pct = clamp(Math.round(mins/PAR_KAAM_WEEKLY_TARGET*100), 0, 100);
  const due = decisionsDueForReview();

  const parSorted = [...state.parKaamLogs].sort((a,b)=> b.date.localeCompare(a.date));
  const parList = parSorted.length ? parSorted.slice(0,15).map(l=>`
    <div class="list-item">
      <div class="list-item-main">
        <div class="list-item-title">${escapeHtml(l.what||'PAR kaam')}</div>
        <div class="list-item-sub">${formatDateNice(l.date)}</div>
      </div>
      <div class="list-item-amount"><span class="num-mono">${l.minutes||0}</span>m</div>
      <div class="list-item-actions"><button class="icon-btn" data-par-edit="${l.id}">\u270E</button></div>
    </div>`).join('') : `<div class="empty-state"><span class="emoji">\u{1F9F1}</span><p>Abhi kuch nahi likha. Hafte mein 120 minute system par lagao.</p><button class="btn btn-primary btn-sm" data-empty-action="addParBtn">PAR kaam jodo</button></div>`;

  const decSorted = [...state.decisions].sort((a,b)=> b.date.localeCompare(a.date));
  const decList = decSorted.length ? decSorted.map(d=>{
    const isDue = d.reviewDate && d.reviewDate <= todayStr() && !d.outcome;
    return `<div class="list-item" style="align-items:flex-start;">
      <div class="list-item-main">
        <div class="list-item-title">${escapeHtml(d.decision||'')}
          ${isDue? '<span class="badge badge-coral" style="margin-left:6px;">Review due</span>' : ''}
          ${d.outcome? '<span class="badge badge-sage" style="margin-left:6px;">Reviewed</span>' : ''}
        </div>
        <div class="list-item-sub">${formatDateNice(d.date)}${d.reviewDate? ' \u00b7 review ' + formatDateNice(d.reviewDate) : ''}</div>
        ${d.worst? `<div class="list-item-sub" style="margin-top:4px;">Sabse bura: ${escapeHtml(d.worst)}</div>`:''}
        ${d.survive? `<div class="list-item-sub">Survive: ${escapeHtml(d.survive)}</div>`:''}
        ${d.taken? `<div class="list-item-sub" style="color:var(--gold);">Faisla: ${escapeHtml(d.taken)}</div>`:''}
        ${d.outcome? `<div class="list-item-sub" style="color:var(--sage);">Asal mein hua: ${escapeHtml(d.outcome)}</div>`:''}
      </div>
      <div class="list-item-actions"><button class="icon-btn" data-dec-edit="${d.id}">\u270E</button></div>
    </div>`;
  }).join('') : `<div class="empty-state"><span class="emoji">\u{1F9ED}</span><p>Abhi koi faisla nahi likha.</p><button class="btn btn-primary btn-sm" data-empty-action="addDecBtn">Faisla likho</button></div>`;

  const conSorted = [...state.contacts].sort((a,b)=> (daysSince(b.lastContact)||999) - (daysSince(a.lastContact)||999));
  const conList = conSorted.length ? conSorted.map(c=>{
    const gap = daysSince(c.lastContact);
    const cold = gap==null || gap >= 30;
    return `<div class="list-item" style="align-items:flex-start;">
      <div class="list-item-main">
        <div class="list-item-title">${escapeHtml(c.name||'')}${c.place? ' \u00b7 ' + escapeHtml(c.place):''}
          ${cold? `<span class="badge badge-coral" style="margin-left:6px;">${gap==null?'kabhi nahi':gap+' din'}</span>`
                : `<span class="badge badge-sage" style="margin-left:6px;"><span class="num-mono">${gap}</span> din</span>`}
        </div>
        ${c.family? `<div class="list-item-sub" style="margin-top:4px;">Ghar: ${escapeHtml(c.family)}</div>`:''}
        ${c.problem? `<div class="list-item-sub">Unki dikkat: ${escapeHtml(c.problem)}</div>`:''}
      </div>
      <div class="list-item-actions"><button class="icon-btn" data-con-edit="${c.id}">\u270E</button></div>
    </div>`;
  }).join('') : `<div class="empty-state"><span class="emoji">\u{1F91D}</span><p>Abhi koi contact nahi.</p><button class="btn btn-primary btn-sm" data-empty-action="addConBtn">Contact jodo</button></div>`;

  const sopList = state.sops.length ? state.sops.map(s=>`
    <div class="list-item" style="align-items:flex-start;">
      <div class="list-item-main">
        <div class="list-item-title">${escapeHtml(s.title||'')}</div>
        <div class="list-item-sub" style="margin-top:6px; white-space:pre-wrap;">${escapeHtml(s.steps||'')}</div>
      </div>
      <div class="list-item-actions"><button class="icon-btn" data-sop-edit="${s.id}">\u270E</button></div>
    </div>`).join('') : `<div class="empty-state"><span class="emoji">\u{1F4CB}</span><p>Abhi koi SOP nahi. Jo kaam baar baar hota hai, ek baar likh do.</p><button class="btn btn-primary btn-sm" data-empty-action="addSopBtn">SOP jodo</button></div>`;

  return `
  <div class="section-title">\u{1F3ED} Business</div>
  <div class="section-sub">Business PAR kaam \u2014 system banana, roz ki aag bujhana nahi.</div>

  ${due.length ? `<div class="note-soft">\u{1F9ED} ${due.length} faisle ka review due hai. Likho ki asal mein kya hua.</div>` : ''}

  <div class="card">
    <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:6px;">
      <h3>Is hafte PAR kaam</h3>
      <button class="btn btn-sm btn-primary" id="addParBtn">+ Minute jodo</button>
    </div>
    <p class="section-sub"><span class="num-mono">${mins}</span> / <span class="num-mono">${PAR_KAAM_WEEKLY_TARGET}</span> minute</p>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div class="list" style="margin-top:14px;">${parList}</div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3>Faisle (Decision log)</h3>
      <button class="btn btn-sm btn-primary" id="addDecBtn">+ Faisla</button>
    </div>
    <div class="list">${decList}</div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:6px;">
      <h3>Contacts</h3>
      <button class="btn btn-sm btn-primary" id="addConBtn">+ Contact</button>
    </div>
    <p class="section-sub">30 din se zyada ho gaya to laal dikhega.</p>
    <div class="list" style="margin-top:8px;">${conList}</div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3>SOP list</h3>
      <button class="btn btn-sm btn-primary" id="addSopBtn">+ SOP</button>
    </div>
    <div class="list">${sopList}</div>
  </div>`;
}

    {key:'minutes', label:'Kitne minute?', type:'number', placeholder:'30', required:true},

function monthKey(ds){ return (ds||'').slice(0,7); }
function inr(n){ return '\u20B9' + Math.round(n||0).toLocaleString('en-IN'); }
/* Average monthly spend, from the months you actually have expenses for */
/* Average monthly spend. The running month is still incomplete, so it is left
   out - otherwise the target dips at the start of every month. */
function avgMonthlyExpense(){
  const ov = Number((state.financeSettings||{}).monthlyKharchaOverride);
  if(ov > 0) return ov;
  const cur = monthKey(todayStr());
  const byMonth = {};
  state.expenses.forEach(e=>{
    const m = monthKey(e.date);
    if(!m || m === cur) return;
    byMonth[m] = (byMonth[m]||0) + (e.amount||0);
  });
  const months = Object.keys(byMonth).sort().slice(-6);
  if(!months.length) return 0;
  return months.reduce((s,m)=> s + byMonth[m], 0) / months.length;
}
function usingKharchaOverride(){ return Number((state.financeSettings||{}).monthlyKharchaOverride) > 0; }
function thisMonthTotals(){
  const m = monthKey(todayStr());
  const income = state.incomeEntries.filter(e=> monthKey(e.date)===m).reduce((s,e)=> s+(e.amount||0), 0);
  const spend  = state.expenses.filter(e=> monthKey(e.date)===m).reduce((s,e)=> s+(e.amount||0), 0);
  return {income, spend, rate: income>0 ? Math.round((income-spend)/income*100) : null};
}

/* ===================== EXPORT ===================== */
function toCSV(rows, headers){
  const esc = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const lines = [headers.map(esc).join(',')];
  rows.forEach(r=> lines.push(headers.map(h=>esc(r[h])).join(',')));
  return lines.join('\n');
}
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
const EXPORT_PERIODS = [{days:7, label:'Weekly'}, {days:30, label:'Monthly'}, {days:90, label:'Quarterly'}];
let exportPeriodDays = 7;
function renderExport(){
  const periodInfo = EXPORT_PERIODS.find(p=>p.days===exportPeriodDays) || EXPORT_PERIODS[0];
  const days = lastNDates(exportPeriodDays);
  const periodStart = days[0];
  const ritualCompleteDays = days.filter(d=> RITUAL_PRACTICES.every(p=> (state.ritualLogs[d]||{})[p.id]?.done)).length;
  const habitPctAvg = state.habits.length? Math.round(days.reduce((s,d)=> s + (state.habits.filter(h=>(state.habitLogs[d]||{})[h.id]).length/state.habits.length), 0)/days.length*100) : 0;
  const periodExpense = state.expenses.filter(e=>e.date>=periodStart).reduce((s,e)=>s+(e.amount||0),0);
  const periodGrowthMins = state.growthEntries.filter(g=>g.date>=periodStart).reduce((s,g)=>s+(g.minutes||0),0);
  const periodGratitude = state.gratitudeEntries.filter(g=>g.date>=periodStart).length;
  const periodMistakes = state.mistakeEntries.filter(m=>m.date>=periodStart).length;
  const periodFightFree = state.relationshipEntries.filter(r=>r.date>=periodStart && r.fightFree).length;
  const weightChange = (()=>{
    const inRange = [...state.weightLog].filter(w=>w.date>=periodStart).sort((a,b)=>a.date.localeCompare(b.date));
    if(inRange.length<2) return null;
    return (inRange[inRange.length-1].weight - inRange[0].weight).toFixed(1);
  })();

  return `
  <div class="section-title">📊 Reports &amp; Export</div>
  <div class="section-sub">Pick a period, see the summary, download for your own analysis.</div>

  <div class="tabs">
    ${EXPORT_PERIODS.map(p=>`<button class="tab ${exportPeriodDays===p.days?'active':''}" data-period="${p.days}">${p.label} (${p.days}d)</button>`).join('')}
  </div>

  <div class="grid-3">
    <div class="stat-box"><div class="num">${ritualCompleteDays}/${days.length}</div><div class="lbl">Full ritual days</div></div>
    <div class="stat-box"><div class="num">${habitPctAvg}%</div><div class="lbl">Avg habit completion</div></div>
    <div class="stat-box"><div class="num">${weightChange!=null? (weightChange>0?'+':'')+weightChange+'kg' : '—'}</div><div class="lbl">Weight change</div></div>
    <div class="stat-box"><div class="num">₹${periodExpense.toFixed(0)}</div><div class="lbl">Total spent</div></div>
    <div class="stat-box"><div class="num">${periodGrowthMins}m</div><div class="lbl">Growth time</div></div>
    <div class="stat-box"><div class="num">${periodGratitude}</div><div class="lbl">Gratitude entries</div></div>
    <div class="stat-box"><div class="num">${periodMistakes}</div><div class="lbl">Lessons logged</div></div>
    <div class="stat-box"><div class="num">${periodFightFree}/${days.length}</div><div class="lbl">Fight-free days</div></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:6px;">Backup</h3>
    <p class="section-sub" style="margin:0;">Aakhri backup: <b>${(state.backupMeta||{}).lastBackupAt ? formatDateNice(state.backupMeta.lastBackupAt) + ' (' + daysSinceBackup() + ' din pehle)' : 'kabhi nahi liya'}</b></p>
  </div>

  <div class="card">
    <h3 style="margin-bottom:6px;">Download</h3>
    <p class="section-sub" style="margin-bottom:18px;">A daily-rows CSV for the ${periodInfo.label.toLowerCase()} period (${periodInfo.days} days), or a full JSON backup of everything ever logged.</p>
    <div class="row">
      <button class="btn btn-primary" id="downloadCsvBtn">${periodInfo.label} summary (CSV)</button>
      <button class="btn" id="downloadJsonBtn">Full backup (JSON)</button>
      <button class="btn" id="importJsonBtn">Restore from backup</button>
      <button class="btn" id="downloadSwBtn">Download sw.js (offline)</button>
      <input type="file" accept="application/json,.json" id="importJsonInput" style="display:none;">
    </div>
    <p class="helper-text" style="margin-top:12px;">Restore purani backup file se sab wapas le aata hai. Abhi ka data badal jayega.</p>
  </div>`;
}
function attachExportHandlers(){
  document.querySelectorAll('[data-period]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      exportPeriodDays = parseInt(btn.getAttribute('data-period'),10);
      switchView('export');
    });
  });
  const csvBtn = document.getElementById('downloadCsvBtn');
  if(csvBtn) csvBtn.addEventListener('click', ()=>{
    const days = lastNDates(exportPeriodDays);
    const rows = days.map(d=>{
      const ritualDone = RITUAL_PRACTICES.filter(p=>(state.ritualLogs[d]||{})[p.id]?.done).length;
      const habitsDone = state.habits.filter(h=>(state.habitLogs[d]||{})[h.id]).length;
      const wt = state.weightLog.find(w=>w.date===d);
      const dayExpense = state.expenses.filter(e=>e.date===d).reduce((s,e)=>s+(e.amount||0),0);
      const growthMin = state.growthEntries.filter(g=>g.date===d).reduce((s,g)=>s+(g.minutes||0),0);
      const gratCount = state.gratitudeEntries.filter(g=>g.date===d).length;
      const mistakeCount = state.mistakeEntries.filter(m=>m.date===d).length;
      const relEntry = state.relationshipEntries.find(r=>r.date===d);
      const ot = oneThingFor(d);
      return {
        date:d, ritual_done:`${ritualDone}/${RITUAL_PRACTICES.length}`, habits_done:`${habitsDone}/${state.habits.length}`,
        habit_points: habitPointsForDay(d),
        sleep_hours: (sleepFor(d)||{}).hours || '',
        sleep_quality: (sleepFor(d)||{}).quality || '',
        phone_away: (sleepFor(d)||{}).phoneAway || '',
        income_inr: state.incomeEntries.filter(e=>e.date===d).reduce((s,e)=>s+(e.amount||0),0),
        par_kaam_minutes: state.parKaamLogs.filter(l=>l.date===d).reduce((s,l)=>s+(Number(l.minutes)||0),0),
        sitting_minutes: state.sittings.filter(s2=>s2.date===d).reduce((s,x)=>s+(Number(x.minutes)||0),0),
        mann_atka: (state.eveningLogs[d]||{}).stuck || '',
        expense_ghar: state.expenses.filter(e=>e.date===d && e.flow!=='business').reduce((s,e)=>s+(e.amount||0),0),
        expense_business: state.expenses.filter(e=>e.date===d && e.flow==='business').reduce((s,e)=>s+(e.amount||0),0),
        one_thing: ot.text, one_thing_done: ot.done ? 'yes' : 'no',
        conflict_logged: state.conflictNotes.some(c=>c.date===d) ? 'yes' : 'no',
        weight_kg: wt? wt.weight : '', expense_inr: dayExpense.toFixed(0), growth_minutes: growthMin,
        gratitude_entries: gratCount, lessons_logged: mistakeCount, relationship: relEntry? (relEntry.fightFree?'fight-free':'friction') : ''
      };
    });
    const csv = toCSV(rows, ['date','ritual_done','habits_done','habit_points','one_thing','one_thing_done','weight_kg','expense_inr','growth_minutes','gratitude_entries','lessons_logged','relationship','conflict_logged','sleep_hours','sleep_quality','phone_away','income_inr','expense_ghar','expense_business','par_kaam_minutes','sitting_minutes','mann_atka']);
    const periodInfo = EXPORT_PERIODS.find(p=>p.days===exportPeriodDays) || EXPORT_PERIODS[0];
    downloadFile(`ai-wisdom-${periodInfo.label.toLowerCase()}-${todayStr()}.csv`, csv, 'text/csv');
    showToast('CSV downloaded');
  });
  const impBtn = document.getElementById('importJsonBtn');
  const impInput = document.getElementById('importJsonInput');
  if(impBtn && impInput){
    impBtn.addEventListener('click', ()=> impInput.click());
    impInput.addEventListener('change', (e)=>{
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        let data;
        try{ data = JSON.parse(reader.result); }
        catch(err){ showToast('File padhi nahi gayi', 'error'); impInput.value=''; return; }
        if(!data || typeof data !== 'object'){ showToast('File theek nahi hai', 'error'); impInput.value=''; return; }
        const found = Object.keys(STORAGE_KEYS).filter(k=> data[k] !== undefined);
        if(!found.length){ showToast('Is file mein koi data nahi mila', 'error'); impInput.value=''; return; }
        openChoice('Restore karein?', found.length + ' cheezein milin. Abhi ka data isse badal jayega.', [
          {label:'Haan, restore karo', value:'yes', primary:true},
          {label:'Rehne do', value:'no'},
        ], async (ans)=>{
          impInput.value='';
          if(ans!=='yes') return;
          for(const k of found){ state[k] = data[k]; await saveKey(k); }
          showToast('Restore ho gaya');
          renderNav();
          switchView('export');
        });
      };
      reader.readAsText(file);
    });
  }
  const swBtn = document.getElementById('downloadSwBtn');
  if(swBtn) swBtn.addEventListener('click', ()=>{
    downloadFile('sw.js', SW_SOURCE, 'application/javascript');
    showToast('sw.js download ho gaya');
  });
  const jsonBtn = document.getElementById('downloadJsonBtn');
  if(jsonBtn) jsonBtn.addEventListener('click', doJsonBackup);
}

function attachDashboardHandlers(){
  const today = todayStr();
  const bkBtn = document.getElementById('dashBackupBtn');
  if(bkBtn) bkBtn.addEventListener('click', ()=>{ doJsonBackup(); switchView('dashboard'); });
  const otText = document.getElementById('oneThingText');
  const otSave = document.getElementById('oneThingSave');
  const otDone = document.getElementById('oneThingDone');
  if(otSave) otSave.addEventListener('click', ()=>{
    setOneThing(today, {text: otText.value});
    showToast('Saved');
  });
  if(otText) otText.addEventListener('blur', ()=> setOneThing(today, {text: otText.value}));
  if(otDone) otDone.addEventListener('click', ()=>{
    const cur = oneThingFor(today);
    setOneThing(today, {text: otText ? otText.value : cur.text, done: !cur.done});
    switchView('dashboard');
  });
  document.querySelectorAll('[data-quick]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const kind = btn.getAttribute('data-quick');
      if(kind==='gratitude'){
        openModal({title:'Today’s gratitude', fields:gratFormFields(), values:{date:todayStr()}, submitLabel:'Save', onSubmit:(data)=>{
          state.gratitudeEntries.push({id:uid(), date:data.date, items:[data.item1,data.item2,data.item3], note:data.note});
          saveKey('gratitudeEntries'); switchView('dashboard');
        }});
      } else if(kind==='weight'){
        openModal({title:'Log weigh-in', fields:weightFormFields(), values:{date:todayStr()}, submitLabel:'Save', onSubmit:(data)=>{
          state.weightLog.push({id:uid(), date:data.date, weight:data.weight});
          saveKey('weightLog'); switchView('dashboard');
        }});
      } else if(kind==='expense'){
        openModal({title:'Add expense', fields:expenseFormFields(), values:{date:todayStr(), category:EXPENSE_CATEGORIES[0], flow:'ghar'}, submitLabel:'Add', onSubmit:(data)=>{
          state.expenses.push({id:uid(), ...data});
          saveKey('expenses'); switchView('dashboard');
        }});
      } else if(kind==='mistake'){
        openModal({title:'New journal entry', fields:mistakeFormFields(), values:{date:todayStr()}, submitLabel:'Add', onSubmit:(data)=>{
          state.mistakeEntries.push({id:uid(), ...data});
          saveKey('mistakeEntries'); switchView('dashboard');
        }});
      }
    });
  });
}

/* ===================== Install on phone (PWA) ===================== */
const APP_ICON_SVG =
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">'
  + '<rect width="512" height="512" rx="96" fill="#0F1D18"/>'
  + '<line x1="256" y1="400" x2="256" y2="150" stroke="#84B594" stroke-width="22" stroke-linecap="round"/>'
  + '<path d="M256 262 q-85 -26 -107 51 q77 21 107 -47" fill="#84B594"/>'
  + '<path d="M256 262 q85 -26 107 51 q-77 21 -107 -47" fill="#84B594"/>'
  + '<circle cx="256" cy="132" r="34" fill="#E3A857"/></svg>';
function iconDataUrl(){ return 'data:image/svg+xml;base64,' + btoa(APP_ICON_SVG); }

function setupPWA(){
  // Manifest is built at runtime and attached as a blob, so everything stays in one file.
  try{
    const manifest = {
      name: 'AI Wisdom',
      short_name: 'AI Wisdom',
      description: 'Daily growth tracker',
      start_url: location.pathname + location.search,
      scope: './',
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#0F1D18',
      theme_color: '#0F1D18',
      icons: [{ src: iconDataUrl(), sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }]
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'}));
    const link = document.createElement('link');
    link.rel = 'manifest'; link.href = url;
    document.head.appendChild(link);
  }catch(e){ /* manifest is a bonus, never block the app */ }

  // Apple touch icon (iOS uses this for the home screen tile)
  try{
    const ai = document.createElement('link');
    ai.rel = 'apple-touch-icon'; ai.href = iconDataUrl();
    document.head.appendChild(ai);
  }catch(e){}

  // Service worker: only possible when the app is served over http(s) from a real file.
  // Browsers refuse to register a worker from a blob: or data: URL, so this is a
  // best-effort attempt that quietly does nothing when it is not available.
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* no sw.js next to index.html - fine */ });
  }
}
/* The worker file, offered as a download so true offline can be switched on
   by dropping it beside index.html on the server. */
const SW_SOURCE = [
  "const CACHE = 'ai-wisdom-v1';",
  "self.addEventListener('install', e => { self.skipWaiting(); });",
  "self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });",
  "self.addEventListener('fetch', e => {",
  "  if (e.request.method !== 'GET') return;",
  "  e.respondWith(",
  "    fetch(e.request).then(res => {",
  "      const copy = res.clone();",
  "      caches.open(CACHE).then(c => c.put(e.request, copy));",
  "      return res;",
  "    }).catch(() => caches.match(e.request).then(r => r || caches.match('index.html')))",
  "  );",
  "});"
].join('\n');

async function init(){
  await loadAll();
  setupPWA();
  renderNav();
  attachShellHandlers();
  document.getElementById('sidebarFoot').innerHTML = escapeHtml(t('saved_note')) + '<br>' + escapeHtml(t('private_note'));
  switchView('dashboard');
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('app').style.display = '';
}
init();

})();
